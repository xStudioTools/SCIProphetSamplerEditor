# XcodeGen spec for Prophet2012. Regenerate the Xcode project with:
#   xcodegen generate
#
# The third party libraries (wxWidgets, PortAudio, PortMidi, libsamplerate) are
# not part of the repository. The target "ThirdParty" runs
# scripts/build-thirdparty-mac.sh, which downloads and builds them as static
# universal libraries into ThirdParty/install. The first build takes a while
# (wxWidgets), later builds skip this step.

name: Prophet2012
options:
  bundleIdPrefix: de.curlsystems
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true

settings:
  base:
    ARCHS: "$(ARCHS_STANDARD)"
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"
    GCC_C_LANGUAGE_STANDARD: gnu11
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    THIRDPARTY_PREFIX: "$(SRCROOT)/ThirdParty/install"
    WX_VERSION: "3.2"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO

aggregateTargets:
  ThirdParty:
    settings:
      base:
        # the script downloads and writes outside of the declared outputs
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    buildScripts:
      - name: Build third party libraries
        script: '"$SRCROOT/scripts/build-thirdparty-mac.sh"'
        inputFiles:
          - "$(SRCROOT)/scripts/build-thirdparty-mac.sh"
        outputFiles:
          - "$(SRCROOT)/ThirdParty/install/.built-all"
        showEnvVars: false

targets:
  Prophet2012:
    type: application
    platform: macOS
    sources:
      - path: SRCDIR
        excludes:
          - "Serial.*"            # Windows only (Win32 serial port)
          - "CurlSerial.*"        # Windows only
          - "mss.*"               # Windows multimedia system MIDI
          - "presetpanel_org.*"   # old, unused version of presetpanel
          - "*.fbp"
          - "Info.plist"
    dependencies:
      - target: ThirdParty
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AudioUnit.framework
      - sdk: CoreMIDI.framework
      - sdk: CoreServices.framework
      - sdk: IOKit.framework
      - sdk: Carbon.framework
      - sdk: Cocoa.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: OpenGL.framework
    info:
      path: SRCDIR/Info.plist
      properties:
        CFBundleName: Prophet2012
        CFBundleDisplayName: Prophet 2012
        CFBundleShortVersionString: "1.5b"
        CFBundleVersion: "1.5"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.curlsystems.prophet2012
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/SRCDIR"
          - "$(SRCROOT)/SRCDIR/wavegen"
          - "$(THIRDPARTY_PREFIX)/include"
          - "$(THIRDPARTY_PREFIX)/lib/wx/include/osx_cocoa-unicode-static-$(WX_VERSION)"
          - "$(THIRDPARTY_PREFIX)/include/wx-$(WX_VERSION)"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "__WXMAC__"
          - "__WXOSX__"
          - "__WXOSX_COCOA__"
          - "_FILE_OFFSET_BITS=64"
          - "wxDEBUG_LEVEL=0"
          - "USE_PORTMIDI"
        # full paths, so no dynamic library of the same name gets linked
        OTHER_LDFLAGS:
          - "$(THIRDPARTY_PREFIX)/lib/libwx_osx_cocoau-$(WX_VERSION).a"
          - "$(THIRDPARTY_PREFIX)/lib/libwxtiff-$(WX_VERSION).a"
          - "$(THIRDPARTY_PREFIX)/lib/libwxjpeg-$(WX_VERSION).a"
          - "$(THIRDPARTY_PREFIX)/lib/libwxpng-$(WX_VERSION).a"
          - "$(THIRDPARTY_PREFIX)/lib/libwxregexu-$(WX_VERSION).a"
          - "$(THIRDPARTY_PREFIX)/lib/libwxzlib-$(WX_VERSION).a"
          - "$(THIRDPARTY_PREFIX)/lib/libwxexpat-$(WX_VERSION).a"
          - "$(THIRDPARTY_PREFIX)/lib/libportaudio.a"
          - "$(THIRDPARTY_PREFIX)/lib/libportmidi.a"
          - "$(THIRDPARTY_PREFIX)/lib/libsamplerate.a"
          - "-lpthread"
          - "-liconv"
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
        GCC_WARN_64_TO_32_BIT_CONVERSION: NO
